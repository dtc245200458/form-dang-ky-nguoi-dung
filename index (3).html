<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký người dùng</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: #f1f5f9;
            color: #1f2937;
            font-family: Arial, Tahoma, sans-serif;
            line-height: 1.5;
        }
        main {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #d1dbe5;
            border-radius: 10px;
        }
        h1 { margin: 0 0 24px; font-size: 25px; color: #174c86; }
        .field { margin-bottom: 18px; }
        .field label, legend { font-weight: bold; }
        .field input {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid #9aabba;
            border-radius: 5px;
            font: inherit;
        }
        fieldset { margin: 0 0 22px; padding: 12px; border: 1px solid #c6d1db; border-radius: 5px; }
        legend { padding: 0 5px; }
        .choices { display: flex; gap: 24px; flex-wrap: wrap; }
        .choices label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
        .choices input { accent-color: #174c86; }
        button {
            padding: 10px 22px;
            background: #174c86;
            color: white;
            border: 0;
            border-radius: 5px;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #103b6b; }
        input:focus-visible, button:focus-visible { outline: 3px solid #d87a20; outline-offset: 3px; }
        @media (max-width: 480px) {
            body { padding: 20px 12px; }
            main { padding: 22px 18px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Đăng ký người dùng</h1>
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            <div class="field">
                <label for="name">Họ và tên:</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel" required>
            </div>
            <fieldset>
                <legend>Giới tính:</legend>
                <div class="choices">
                    <label><input type="radio" name="gender" value="Nam" required> Nam</label>
                    <label><input type="radio" name="gender" value="Nữ" required> Nữ</label>
                </div>
            </fieldset>
            <button type="submit">Đăng ký</button>
        </form>
    </main>
</body>
</html>
